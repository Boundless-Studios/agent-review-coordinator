[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-review-coordinator"
version = "0.2.0"
description = "Provider-neutral coordination and settlement for agentic code review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Boundless Studios" }]
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[project.urls]
Homepage = "https://github.com/Boundless-Studios/agent-review-coordinator"
Repository = "https://github.com/Boundless-Studios/agent-review-coordinator"

[project.scripts]
agent-review-coordinator = "agent_review_coordinator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_review_coordinator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
